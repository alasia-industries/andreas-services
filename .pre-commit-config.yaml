# Local pre-commit hooks. Mirrors what the PR workflows enforce so bad
# templates / Terraform never make it into a PR in the first place.
#
# Setup (once):
#   pip install pre-commit
#   pre-commit install
#
# Run manually against everything:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        # Only validate root configs (envs). Reusable modules have no
        # provider config and fail standalone validate.
        files: ^infra/.*\.tf$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.8
    hooks:
      - id: ruff-check
        files: ^classroom/.*\.py$

