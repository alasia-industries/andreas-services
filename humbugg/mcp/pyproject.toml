[project]
name = "humbugg-mcp"
version = "0.1.0"
description = "Humbugg as an MCP connector: groups, wish lists, assignments and the draw, as tools for Claude"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "boto3>=1.34",
]

[project.optional-dependencies]
hosted = ["uvicorn>=0.30"]

[dependency-groups]
dev = ["pytest>=8", "uvicorn>=0.30", "pycognito>=2024.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["humbugg_mcp"]
# The built pages are gitignored, which hatch would otherwise leave out.
artifacts = ["humbugg_mcp/ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
