name: Humbugg · PR

on:
  pull_request:
    paths:
      - 'humbugg/**'
      - '.github/workflows/humbugg-pr.yml'

env:
  AWS_REGION: us-east-1

jobs:
  # ---------------------------------------------------------------------------
  # Tier 0 – validate Terraform configuration
  # ---------------------------------------------------------------------------
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.63.1

      - name: Terraform fmt check
        run: terraform -chdir=humbugg/infra/envs/prod fmt -check -recursive ../../

      - name: Terraform validate
        run: |
          terraform -chdir=humbugg/infra/envs/prod init -backend=false -input=false
          terraform -chdir=humbugg/infra/envs/prod validate

      - name: Test canonical redirect
        run: node --test humbugg/infra/modules/hosting_marketing/canonical_redirect.test.mjs

      # The pre-sign-up trigger, same shape: a zip from one file, tested with
      # nothing installed. scripts/auth-trigger/pre-sign-up.mjs.
      - name: Pre-sign-up trigger unit tests
        run: node --test humbugg/scripts/auth-trigger/pre-sign-up.test.mjs

      - name: Install tflint AWS plugin
        run: bash .github/scripts/install-tflint-aws-plugin.sh

      - name: tflint
        run: tflint --recursive --chdir=humbugg/infra --config "$(pwd)/.tflint.hcl"

  validate-backend:
    name: Validate .NET Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore humbugg/backend/Humbugg.slnx
      - name: Format check
        run: dotnet format humbugg/backend/Humbugg.slnx --verify-no-changes --no-restore
      # COVERAGE IS PRINTED AND GATES ON NOTHING. There is no threshold, deliberately:
      # one picked before anyone has read a real number either sits under it (and means
      # nothing) or fires on unrelated PRs until somebody deletes it. The integration
      # project self-skips here (no HUMBUGG_INTEGRATION), so its report reads near zero
      # by design — the unit project's number is the one to watch.
      - name: Test
        run: |
          cd humbugg/backend
          dotnet test Humbugg.slnx --configuration Release --no-restore -- --coverage --coverage-output-format cobertura

      - name: Coverage summary
        run: |
          for report in $(find humbugg/backend -path '*/TestResults/*.cobertura.xml'); do
            rate=$(grep -o 'line-rate="[0-9.]*"' "$report" | head -1 | grep -o '[0-9.]*')
            project=$(echo "$report" | sed 's|humbugg/backend/||;s|/bin/.*||')
            echo "$project line coverage: $(awk "BEGIN {printf \"%.1f%%\", $rate * 100}")"
          done

  # ---------------------------------------------------------------------------
  # Tier 1 – verify Docker build + marketing site build (no push, no deploy)
  # ---------------------------------------------------------------------------
  build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image (verify only, no push)
        run: |
          cd humbugg/backend
          DOCKER_BUILDKIT=0 docker build -t humbugg-backend:ci-verify .

      - name: Smoke test backend runtime and health
        run: |
          # The DynamoDB table names are required at startup — HumbuggSettings
          # refuses to guess them, because a guessed name silently targets a
          # table that does not exist. Nothing here touches DynamoDB (the smoke
          # test only calls /health), so these are placeholders that just have
          # to be present.
          docker run -d \
            --name humbugg-backend-smoke \
            -p 5088:8080 \
            --entrypoint dotnet \
            -e ASPNETCORE_URLS=http://+:8080 \
            -e HUMBUGG_PROFILES_TABLE=ci-smoke-profiles \
            -e HUMBUGG_GROUPS_TABLE=ci-smoke-groups \
            -e HUMBUGG_INVITATIONS_TABLE=ci-smoke-invitations \
            -e HUMBUGG_REMINDERS_TABLE=ci-smoke-reminders \
            -e HUMBUGG_TEMPLATES_TABLE=ci-smoke-templates \
            -e HUMBUGG_QUESTIONS_TABLE=ci-smoke-questions \
            -e HUMBUGG_GROUPMEMBERS_TABLE=ci-smoke-groupmembers \
            -e HUMBUGG_WISHES_TABLE=ci-smoke-wishes \
            -e HUMBUGG_DRAWS_TABLE=ci-smoke-draws \
            -e HUMBUGG_AUDIT_EVENTS_TABLE=ci-smoke-audit-events \
            -e HUMBUGG_ANALYTICS_EVENTS_TABLE=ci-smoke-analytics-events \
            -e HUMBUGG_EMAIL_MESSAGES_TABLE=ci-smoke-email-messages \
            -e HUMBUGG_BILLING_TABLE=ci-smoke-billing \
            humbugg-backend:ci-verify Humbugg.Api.dll
          trap 'docker rm -f humbugg-backend-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent --show-error http://127.0.0.1:5088/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs humbugg-backend-smoke
          exit 1

  build-marketing:
    name: Build Marketing Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: humbugg/marketing/package-lock.json

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd humbugg/marketing && npm ci

      - name: Typecheck, test, and build
        run: |
          cd humbugg/marketing
          npm run typecheck
          npm test -- --coverage
          npm run build

      # The design system ships one component as a .web/.native pair behind a
      # single extensionless export, and the bundler picks the leaf. Resolving
      # the wrong one compiles, bundles, typechecks and unit-tests cleanly — it
      # only shows up as a screen that renders wrong, so this is the only check
      # that can catch it.
      - name: Assert the web build took the web leaf
        run: node humbugg/scripts/assert-design-system-leaves.mjs web humbugg/marketing/build

      - name: Build SSR Lambda image
        run: cd humbugg/marketing && docker build -t humbugg-marketing:ci-verify .

      - name: Smoke test SSR Lambda handler import
        run: |
          docker run --rm --entrypoint node humbugg-marketing:ci-verify \
            -e "import('./server/index.mjs').then(({ handler }) => { if (typeof handler !== 'function') process.exit(1); console.log('SSR handler ready'); })"

  build-app:
    name: Build Product App
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: humbugg/app/package-lock.json

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd humbugg/app && npm ci

      - name: Typecheck and test
        run: |
          cd humbugg/app
          npx tsc --noEmit
          npm test -- --coverage

      # The hosted sign-in pages are styled by a committed JSON document, not by
      # the design system, so nothing else would notice it falling out of step
      # with the app's brand colours. This is what notices.
      - name: Cognito branding in sync with brand colours
        run: cd humbugg/app && npm run brand:check

      # Two accessibility mistakes that are invisible at runtime and obvious in a
      # grep: an `aria-label` inside a `FieldLabel` (which the design system's
      # `aria-labelledby` silently overrides) and a bare control with no name at
      # all. Eighteen of the first had accumulated before anything looked.
      - name: Accessibility rules
        run: cd humbugg/app && npm run a11y:check

      # A real export, not just a typecheck: Metro resolution failures against
      # the design system's platform leaves only surface when the bundle is
      # actually built, and they would otherwise reach production.
      #
      # --source-maps is required by the leaf assertion below, which reads the
      # `sources` list. Grepping the bundle for react-native-web is NOT a
      # substitute: it is present in any Expo web build because the app's own
      # primitives use it, so it passes whichever leaf was resolved.
      # Placeholder Cognito values: the export must not be built with them empty,
      # because that is a different code path (the app settles into signed-out and
      # never constructs an authorize request). Nothing here is deployed.
      - name: Export for web
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.humbugg.com/api
          EXPO_PUBLIC_COGNITO_DOMAIN: auth.humbugg.com
          EXPO_PUBLIC_COGNITO_CLIENT_ID: pr-build-placeholder
        run: cd humbugg/app && npx expo export -p web --source-maps

      # Metro is the bundler that gets this wrong unaided: for platform 'web' its
      # candidate extensions are .web.tsx then .tsx, and .native is not
      # considered at all. humbugg/app/metro.config.js corrects it; this proves
      # the correction still works. Without it the app renders entirely unstyled,
      # because Tailwind class strings mean nothing in a project with no Tailwind.
      - name: Assert the app build took the native leaf
        run: node humbugg/scripts/assert-design-system-leaves.mjs native humbugg/app/dist

      # Metro inlines EXPO_PUBLIC_* at build time, so the exported bundle is the
      # only place a wrong API base URL is visible. A bare origin misses the
      # gateway's /api prefix, 404s off-route with no CORS headers, and breaks
      # every call from the app as "Failed to fetch" — shipped in #217, unnoticed
      # until a user could not create a profile.
      - name: Assert the app's API base URL keeps the /api prefix
        run: node humbugg/scripts/assert-app-api-base.mjs humbugg/app/dist

      # The browser tier, stubbed. Playwright's webServer performs its own export
      # (with --clear: Metro's cache does not key on env) using the e2e values — a
      # same-origin /api base so page.route catches everything, and fake-but-present
      # Cognito config — then serves it statically. Every /api/** answer comes from
      # committed fixtures captured by e2e/support/capture-fixtures.mjs; no AWS, no
      # credentials, which is what lets this run in a workflow that never writes to
      # AWS. `--with-deps` because the runner has no browser; the browser download,
      # not the app, is what makes this step slow.
      - name: Install Playwright chromium
        run: cd humbugg/app && npx playwright install --with-deps chromium

      - name: Browser suite (stubbed)
        run: cd humbugg/app && npm run e2e

      # Playwright writes one trace per failure and nothing on a pass.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: humbugg/app/test-results/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # The MCP connector (humbugg/mcp): unit and auth-shim tests, the MCP Apps
  # pages, the Lambda image, then protocol conformance, schema portability and
  # fuzzing against the server running locally. Nothing here reaches AWS, dev
  # or prod: `humbugg_mcp.testing:app` is the server with auth off and the API
  # answered from fixtures, which is the ONLY thing Specmatic may point at — it
  # calls every tool, destructive ones included.
  # ---------------------------------------------------------------------------
  mcp:
    name: MCP Connector
    runs-on: ubuntu-latest
    # A hung step otherwise holds the runner for GitHub's six-hour default.
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      MCP_URL: http://127.0.0.1:5002/mcp

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: humbugg/mcp/uv.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ansavva'
          cache: npm
          cache-dependency-path: humbugg/mcp/widgets/package-lock.json

      - name: Install widget dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd humbugg/mcp/widgets && npm ci

      # Writes humbugg_mcp/ui/*.html, which the server serves and the image
      # copies — so it runs before pytest and before docker build.
      - name: Build the MCP Apps pages
        run: cd humbugg/mcp/widgets && npm run build

      - name: Widget unit tests
        run: cd humbugg/mcp/widgets && npm test

      - name: Python tests
        run: cd humbugg/mcp && uv run --group dev pytest -q

      - name: Install Playwright chromium
        run: cd humbugg/mcp/widgets && npx playwright install --with-deps chromium

      - name: Widget browser tests
        run: cd humbugg/mcp/widgets && npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-widget-playwright-traces
          path: humbugg/mcp/widgets/test-results/
          retention-days: 7
          if-no-files-found: ignore

      # amd64 on this runner, as in humbugg-prod.yaml; the Lambda is x86_64.
      - name: Build the MCP Lambda image (verify only, no push)
        run: docker build -t humbugg-mcp:ci-verify humbugg/mcp

      - name: Start the stubbed server
        run: |
          cd humbugg/mcp
          nohup uv run --extra hosted uvicorn humbugg_mcp.testing:app \
            --host 127.0.0.1 --port 5002 > "${RUNNER_TEMP}/mcp-server.log" 2>&1 < /dev/null &
          # A POST initialize answers at once. A bare GET /mcp is the server's event
          # stream, which never ends: that probe hung this step until the job timed out.
          for _ in {1..30}; do
            code="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 5 \
              -X POST -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              "${MCP_URL}" || true)"
            if [ "${code}" != "000" ]; then echo "server answered ${code}"; exit 0; fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/mcp-server.log"
          exit 1

      # The official suite: lifecycle, tools, resources, JSON Schema, stateless
      # HTTP, headers, DNS rebinding. v0.1.x, so pinned; a baseline, when one
      # exists, lists the known failures and fails the run on a stale entry.
      - name: MCP conformance suite
        run: |
          baseline=humbugg/mcp/tests/conformance-baseline.yml
          args=(server --url "${MCP_URL}")
          if [ -f "${baseline}" ]; then args+=(--expected-failures "${baseline}"); fi
          npx --yes @modelcontextprotocol/conformance@0.1.16 "${args[@]}"

      # --strict: exit 6 on an error-severity schema portability problem, the
      # kind a host refuses. --app-info: the page tools are recognised as MCP
      # Apps. tools/list --app-info is NDJSON and exits 0 regardless, so the
      # assertion is on the body: at least one tool must carry an App.
      - name: Inspector CLI — strict schemas and MCP Apps
        run: |
          set -euo pipefail
          MCP_STORAGE_DIR="$(mktemp -d)"
          export MCP_STORAGE_DIR
          export MCP_INSPECTOR_OAUTH_STATE_PATH="${MCP_STORAGE_DIR}/oauth.json"
          mcp() {
            npx --yes @modelcontextprotocol/inspector@2.8.0 --cli \
              --transport http --server-url "${MCP_URL}" \
              --connect-timeout 10000 --stored-auth-only "$@"
          }
          mcp --method tools/list --strict --format json > /dev/null
          echo "ok: tools/list --strict"
          apps="$(mcp --method tools/list --app-info)"
          printf '%s\n' "${apps}"
          printf '%s\n' "${apps}" | jq -s -e \
            'map(select((.appInfo.hasApp // .hasApp) == true)) | length > 0' > /dev/null
          echo "ok: MCP Apps present"

      # Positive and mutated calls for every tool, from the sample arguments in
      # the dictionary. --network host because host.docker.internal does not
      # resolve on a Linux runner without extra flags, and the server listens
      # on the runner's loopback.
      - name: Specmatic MCP auto test
        run: |
          mkdir -p "${RUNNER_TEMP}/specmatic"
          docker run --rm --network host \
            -v "${RUNNER_TEMP}/specmatic:/usr/src/app/build/reports/specmatic" \
            -v "$(pwd)/humbugg/mcp/tests/specmatic-dictionary.json:/usr/src/app/specmatic-dictionary.json:ro" \
            specmatic/specmatic:2.55.0 mcp test \
            --url "${MCP_URL}" \
            --transport-kind=STREAMABLE_HTTP \
            --dictionary-file specmatic-dictionary.json \
            --enable-resiliency-tests \
            > "${RUNNER_TEMP}/specmatic/run.log" 2>&1 \
            || { tail -n 60 "${RUNNER_TEMP}/specmatic/run.log"; exit 1; }
          # Its per-case output (~30k cases) goes to run.log, uploaded below: inline it
          # overran GitHub's log view and hid the gate's summary.
          # Specmatic exits 0 whatever its verdicts; this is the gate.
          python3 humbugg/mcp/tests/specmatic_check.py "${RUNNER_TEMP}/specmatic/mcp/mcp_test_report.json"

      - name: Upload Specmatic report and server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-conformance-reports
          path: |
            ${{ runner.temp }}/specmatic/
            ${{ runner.temp }}/mcp-server.log
            results/
          retention-days: 7
          if-no-files-found: ignore
