name: Shared infra · Terraform apply · Prod

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/shared-prod-infra-deploy.yaml'
  workflow_dispatch:

concurrency:
  group: shared-infra
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_DIR: infra/envs/shared

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    environment: shared-infra
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '~1.16'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          # Cost-alert subscriber (cost_guardrails.tf). Unset = topic without a subscription.
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
        run: terraform apply -auto-approve -input=false
